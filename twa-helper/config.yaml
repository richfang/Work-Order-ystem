# 小程序游戏挂机助手 配置文件（传奇类换皮小程序通用）
# 全战觉醒 / 英雄铁魂 / 奇光霸业 / 龙迹之城 等都是同一套传奇换皮，UI 几乎一致，
# 所以默认共用一套模板(传奇通用)。任务架构参考了同类挂机脚本的分层。

device:
  serial: ""           # 留空自动取第一个；多开用命令行 --serial 指定
  adb_path: "adb"

vision:
  threshold: 0.85
  template_root: "templates"

loop:
  interval: 2.0
  max_retries: 3
  idle_limit: 30

notify:
  enabled: false
  type: "webhook"      # webhook(企业微信/钉钉) / serverchan
  url: ""
  on: ["stuck", "error"]

active_game: "传奇通用"

games:
  传奇通用:
    # 换皮游戏共用这一套模板目录；某个游戏 UI 有差异时可单独建目录并改这里
    template_dir: "传奇通用"
    # 任务执行顺序(--loop 时每轮按序跑)：
    #   开局 -> 日常活动 -> 刷图(主力) -> 合成 -> 回收 -> 卡死检测
    # auto_grind 配了 max_rounds，刷够轮数会让位给后面的任务，循环轮换。
    tasks:
      - startup
      - daily_activities
      - auto_grind
      - auto_craft
      - stall_recycle
      - relog_guard

    task_options:
      auto_grind:
        maps: ["map_1", "map_2"]            # 地图入口模板，轮换刷
        boss_priority: ["boss_1", "boss_2"] # boss 优先级(先打谁)
        monsters: ["monster"]               # 普通怪
        revive: ["revive_btn"]              # 死亡复活
        pick_loot: true
        loot_btn: "pickup"
        no_target_limit: 8                  # 连续无怪轮数 -> 换图
        round_wait: 1.5
        max_rounds: 200                     # 刷够轮数让位给其它任务

      auto_craft:
        open_btns: ["bag_btn", "craft_btn"]
        craft_btn: "do_craft"
        confirm_btn: "confirm"
        only_ultimate: true
        max_craft: 30

      stall_recycle:
        open_btns: ["bag_btn"]
        recycle_btn: "recycle"
        confirm_btn: "confirm"
        back_city: false

      daily_activities:
        # 每个活动：入口序列 -> 开始 -> (等结算) -> 领奖。入口找不到=没开放，自动跳过。
        activities:
          - name: "比武大会"
            entry: ["activity_btn", "biwu_btn"]
            start: "biwu_start"
            claim: "claim_btn"
          - name: "称霸天下"
            entry: ["activity_btn", "czts_btn"]
            claim: "claim_btn"
          # 按需继续加：服战 / 界海探秘 / 神坛 / 跨服沙巴克 ...

      relog_guard:
        samples: 4
        sample_gap: 2.0
        diff_threshold: 2.0
        restart_wechat: false
        wechat_package: "com.tencent.mm"

  # 如果哪个游戏 UI 不一样，可单独配并指向自己的模板目录：
  # 龙迹之城:
  #   template_dir: "龙迹之城"
  #   tasks: [startup, auto_grind]

log:
  level: "INFO"
  dir: "logs"
  save_debug_shots: false
