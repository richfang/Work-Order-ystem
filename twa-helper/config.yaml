# 小程序游戏挂机助手 配置文件
# 支持多游戏(profile)。单机先跑通，以后多设备/管理系统直接复用本配置。

device:
  # ADB 设备序列号。模拟器常见地址：
  #   雷电: emulator-5554 或 127.0.0.1:5555
  #   MuMu: 127.0.0.1:7555
  #   夜神: 127.0.0.1:62001
  # 留空 ("") 则自动使用 adb devices 里第一个设备。
  # 也可在命令行用 --serial 覆盖（多开时按台指定）。
  serial: ""
  adb_path: "adb"

vision:
  # 模板匹配相似度阈值 (0~1)，越高越严格。一般 0.8 起调
  threshold: 0.85
  # 模板根目录；每个游戏的模板放在 templates/<游戏名>/ 下
  template_root: "templates"

loop:
  interval: 2.0        # 每轮主循环间隔秒
  max_retries: 3       # 找图失败重试
  idle_limit: 30       # 连续空转多少次判定卡死并告警

notify:
  enabled: false       # 卡死/出错时推送通知（无人值守挂机很有用）
  type: "webhook"      # webhook(企业微信/钉钉机器人) / serverchan(Server酱)
  url: ""              # 机器人 Webhook 地址 或 Server酱 SendKey URL
  on: ["stuck", "error"]   # 触发推送的事件

# 当前要跑的游戏（也可命令行 --game 覆盖）
active_game: "英雄铁魂"

# 各游戏的独立配置；模板目录默认 templates/<游戏名>/
games:
  英雄铁魂:
    tasks:
      - daily_login
      - auto_battle
      - collect_resource
    task_options:
      auto_battle:
        repeat: 10
      collect_resource:
        enabled: true

  奇光霸业:
    tasks:
      - daily_login
      - collect_resource
    task_options:
      collect_resource:
        enabled: true

log:
  level: "INFO"        # DEBUG / INFO / WARNING / ERROR
  dir: "logs"
  save_debug_shots: false
