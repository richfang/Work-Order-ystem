# 小程序游戏挂机助手 配置文件（传奇类换皮小程序通用）
# 全战觉醒 / 英雄铁魂 / 奇光霸业 / 龙迹之城 等都是同一套传奇换皮，UI 几乎一致，
# 所以默认共用一套模板(传奇通用)。任务架构参考了同类挂机脚本的分层。

device:
  serial: ""           # 留空自动取第一个；多开用命令行 --serial 指定
  adb_path: "adb"

vision:
  threshold: 0.85
  template_root: "templates"

loop:
  interval: 2.0
  max_retries: 3
  idle_limit: 30

notify:
  enabled: false
  type: "webhook"      # webhook(企业微信/钉钉) / serverchan
  url: ""
  on: ["stuck", "error"]

active_game: "传奇通用"

games:
  传奇通用:
    # 换皮游戏共用这一套模板目录；某个游戏 UI 有差异时可单独建目录并改这里
    template_dir: "传奇通用"
    # 任务执行顺序(--loop 时每轮按序跑)：
    #   开局 -> 日常活动 -> 刷图(主力) -> 合成 -> 回收 -> 卡死检测
    # auto_grind 配了 max_rounds，刷够轮数会让位给后面的任务，循环轮换。
    tasks:
      - startup
      - daily_activities
      - auto_grind
      - auto_craft
      - stall_recycle
      - relog_guard

    task_options:
      auto_grind:
        open_grind_btn: "grind_map_btn"     # 打开挂机/传送地图面板
        maps: ["map_1", "map_2", "map_3"]   # 左侧地图列表项(从模拟器裁图)
        enter_btn: "enter_map_btn"          # 红色「进入」
        revive: ["revive_btn"]              # 死亡复活弹窗
        cleared_flag: "map_cleared"         # (可选)清图标志，提前换图
        dwell_seconds: 600                  # 每图挂 10 分钟换
        check_interval: 10
        max_switches: 6                     # 换 6 次图后让位给其它任务

      daily_activities:
        # 每个活动：从总地图(world_map_btn)进入 -> 点该活动 -> 开始 -> 领奖
        # 入口找不到=没开放/次数用完，自动跳过。按你游戏补全模板名。
        activities:
          - name: "远古荒原"
            entry: ["world_map_btn", "act_yuangu"]
            start: "enter_map_btn"
            claim: "claim_btn"
          - name: "狂暴战场"
            entry: ["world_map_btn", "act_kuangbao"]
            start: "challenge_btn"     # 前往挑战
            claim: "claim_btn"
          - name: "比武大会"
            entry: ["world_map_btn", "act_biwu"]
            start: "match_btn"         # 匹配对手
            claim: "claim_btn"
          - name: "天空之城"
            entry: ["world_map_btn", "act_tiankong"]
            start: "onekey_btn"        # 一键挑战
            claim: "claim_btn"
          - name: "禁地福利"
            entry: ["world_map_btn", "act_jindi"]
            start: "challenge_btn"
            claim: "claim_btn"
          - name: "万妖牢狱"
            entry: ["world_map_btn", "act_wanyao"]
            start: "enter_map_btn"
            claim: "claim_btn"

      auto_craft:
        open_btns: ["bag_btn", "craft_btn"]
        craft_btn: "do_craft"
        confirm_btn: "confirm"
        only_ultimate: true
        max_craft: 30

      stall_recycle:
        open_btns: ["bag_btn"]
        recycle_btn: "recycle"
        confirm_btn: "confirm"
        back_city: false

      relog_guard:
        samples: 4
        sample_gap: 2.0
        diff_threshold: 2.0
        restart_wechat: false
        wechat_package: "com.tencent.mm"

  # 如果哪个游戏 UI 不一样，可单独配并指向自己的模板目录：
  # 龙迹之城:
  #   template_dir: "龙迹之城"
  #   tasks: [startup, auto_grind]

log:
  level: "INFO"
  dir: "logs"
  save_debug_shots: false
